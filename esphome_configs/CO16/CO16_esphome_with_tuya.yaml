    mux_id: co16_pt100_mux
    internal: true
    clk_pin: GPIO11
    mosi_pin: GPIO10
    miso_pin: GPIO12
    cs_pin: GPIO14
    reference_resistance: 400 ohm
    rtd_nominal_resistance: 100 ohm
    rtd_wires: 3
    mains_filter: 50 Hz
    update_interval: never

  - platform: template
    name: "CO16 PT100 01"
    id: co16_pt100_01
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
  - platform: template
    name: "CO16 PT100 02"
    id: co16_pt100_02
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
  - platform: template
    name: "CO16 PT100 03"
    id: co16_pt100_03
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
  - platform: template
    name: "CO16 PT100 04"
    id: co16_pt100_04
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never

interval:
  - interval: 10s
    then:
      - repeat:
          count: 4
          then:
            - nx3l4051.select:
                id: co16_pt100_mux
                channel: !lambda return id(co16_pt100_channel);
            - component.update: co16_pt100_reader
            - delay: 70ms
            - lambda: |-
                const float value = id(co16_pt100_reader).state;
                switch (id(co16_pt100_channel)) {
                  case 0:
                    id(co16_pt100_01).publish_state(value);
                    break;
                  case 1:
                    id(co16_pt100_02).publish_state(value);
                    break;
                  case 2:
                    id(co16_pt100_03).publish_state(value);
                    break;
                  default:
                    id(co16_pt100_04).publish_state(value);
                    break;
                }
                id(co16_pt100_channel) = (id(co16_pt100_channel) + 1) % 4;