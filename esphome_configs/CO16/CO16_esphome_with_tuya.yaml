esphome:
  name: kincony-co16
  friendly_name: KinCony CO16
  name_add_mac_suffix: true
  min_version: 2026.5.3

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG

api:

ota:
  - platform: esphome

ethernet:
  type: W5500
  clk_pin: GPIO1
  mosi_pin: GPIO2
  miso_pin: GPIO41
  cs_pin: GPIO42
  interrupt_pin: GPIO43
  reset_pin: GPIO44
  clock_speed: 16MHz
  interface: spi2

web_server:
  port: 80

external_components:
  - source:
      type: git
      url: https://github.com/hzkincony/esphome-tuya-wifi-mcu
      ref: v1.4.0
    components:
      - nx3l4051
      - nx3l4051_max31865

  - source:
      type: git
      url: https://github.com/hzkincony/esphome-tuya-wifi-mcu
      ref: feat/esp-idf-support

i2c:
  sda: GPIO8
  scl: GPIO18
  frequency: 100kHz
  scan: true

pcf8574:
  - id: co16_relay_hub
    address: 0x22
    pcf8575: true

xl9535:
  - id: co16_input_hub
    address: 0x24

ads1115:
  - id: co16_adc_01_04
    address: 0x48
  - id: co16_adc_05_08
    address: 0x49
  - id: co16_adc_09_12
    address: 0x4B
  - id: co16_adc_13_16
    address: 0x4A

nx3l4051:
  - id: co16_pt100_mux
    pin_s1: GPIO7
    pin_s2: GPIO21
    pin_s3: LOW
    delay: 20ms

globals:
  - id: co16_pt100_channel
    type: uint8_t
    restore_value: false
    initial_value: "0"

uart:
  - id: uart_1
    baud_rate: 9600
    debug:
      direction: BOTH
      dummy_receiver: true
      after:
        timeout: 10ms
    tx_pin: GPIO39
    rx_pin: GPIO38

  - id: tuya_mcu_uart
    tx_pin: GPIO16
    rx_pin: GPIO17
    baud_rate: 9600

tuya_wifi_mcu:
  product_id: 8svouhd9lziyz5py
  uart_id: tuya_mcu_uart
  wifi_control_mode: module
  wifi_reset_pin: 28
  wifi_led_pin: 16

switch:
  - platform: gpio
    name: "CO16 Output 01"
    id: co16_output_01
    restore_mode: ALWAYS_OFF
    pin:
      pcf8574: co16_relay_hub
