sensor:
  - platform: ads1115
    ads1115_id: co16_adc_01_04
    multiplexer: A0_GND
    gain: 4.096
    name: "CO16 Analog Input 01"
    id: co16_analog_input_01
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 5s
    filters:
      - lambda: 'return x <= 0.0025f ? 0.0f : x;'
      - multiply: 5.16696
      - clamp:
          min_value: 0.0
          max_value: 10.0
